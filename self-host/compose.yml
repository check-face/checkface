services:
  setup:
    build: .
    profiles: [setup]
    user: "0:0"
    volumes:
      - models:/models
    entrypoint: [python, setup.py]
  db:
    image: mongo:8.0.13
    volumes:
      - database:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 10s
      retries: 12
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      CHECKFACE_ORIGINAL_CACHE_BYTES: ${CHECKFACE_ORIGINAL_CACHE_BYTES:-10737418240}
      CHECKFACE_CPU_THREADS: ${CHECKFACE_CPU_THREADS:-auto}
      MONGODB_CONNECTION_STRING: mongodb://db:27017
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - models:/models:ro
      - cache:/app/checkfacedata
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 180s
volumes:
  models:
  database:
  cache:
