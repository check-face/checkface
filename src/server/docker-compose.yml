# CheckFace API stack. See SELF-HOSTING.md for prerequisites and GPU-generation choices.
#   docker compose up -d --build                         # GTX 10xx / RTX 20xx (TensorFlow 1.15.5, CUDA 10.0)
#   CHECKFACE_TF_BASE=ngc docker compose up -d --build   # RTX 30xx / 40xx, A100, H100 (NVIDIA TF1 23.03, CUDA 12.1)
services:
  encoderapi:
    build:
      context: ../encoder
      args:
        TORCH_CUDA: ${CHECKFACE_ENCODER_TORCH:-cu126}
    restart: unless-stopped
    environment:
      ENCODER_DEVICE: ${CHECKFACE_ENCODER_DEVICE:-auto}  # set cpu to leave all GPU memory to the generator
    ports:
     - "8083:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    build:
      context: .
      args:
        TF_BASE: ${CHECKFACE_TF_BASE:-legacy}
    depends_on:
      - db
    stdin_open: true
    tty: true
    restart: unless-stopped
    environment:
      GENERATOR_BATCH_SIZE: ${GENERATOR_BATCH_SIZE:-10}
      LOW_GPU_MEM: ${LOW_GPU_MEM:-False}
    ports:
     - "8080:8080"
     - "8000:8000"
    volumes:
     - "${CHECKFACE_DATA_DIR:-./checkfacedata}:/app/checkfacedata"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: '2gb'

  db:
    image: mongo:4.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    restart: unless-stopped
    volumes:
      - checkfacedbdata:/data/db

volumes:
  checkfacedbdata:
    # Fixed name so an existing deployment keeps using its volume; created automatically on a fresh host.
    name: checkfacedbdata
